<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Converter - 0mod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            black: '#0f172a',
                            gray: '#f8fafc',
                            accent: '#10b981',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../shared/base.css">
    <meta name="description" content="Free offline tool to convert between Markdown, PDF, and HTML securely in your browser.">
    <!-- Scripts for conversion (Local Vendored with 100% Offline Capability) -->
    <script src="../shared/vendor/marked.min.js"></script>
    <script src="../shared/vendor/jspdf.umd.min.js"></script>
    <script src="../shared/vendor/turndown.js"></script>
    <script src="../shared/vendor/pdf.min.js"></script>
    <script>
        // PDF.js worker
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = '../shared/vendor/pdf.worker.min.js';
        }
    </script>
</head>
<body class="bg-brand-gray dark:bg-slate-950 min-h-screen font-sans text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200">
    <div id="app" class="max-w-5xl mx-auto px-4 py-12"></div>

    <script src="../shared/ui-kit.js"></script>
    <script src="../shared/icons.js"></script>
    <script>
        const app = document.getElementById('app');

        // State
        let state = {
            isProcessing: false,
            mode: 'md-to-pdf',
            inputText: '',
            outputHtml: '',
            outputUrl: null,
            pdfFile: null
        };

        const modes = [
            { id: 'md-to-pdf', label: 'Markdown to PDF' },
            { id: 'md-to-html', label: 'Markdown to HTML' },
            { id: 'html-to-md', label: 'HTML to Markdown' },
            { id: 'pdf-to-md', label: 'PDF to Markdown' }
        ];

        // Logic
        async function handleAction() {
            state.isProcessing = true;
            state.outputUrl = null;
            state.outputHtml = '';
            render();

            try {
                if (state.mode === 'md-to-pdf') {
                    if (!state.inputText.trim()) throw new Error("Please enter some Markdown text.");
                    const htmlContent = marked.parse(state.inputText);
                    
                    const container = document.createElement('div');
                    container.className = 'pdf-render-container p-8 bg-white text-slate-900 font-sans space-y-4';
                    container.style.position = 'absolute';
                    container.style.left = '-9999px';
                    container.style.width = '750px';
                    container.innerHTML = `
                        <style>
                            h1 { font-size: 24px; font-weight: bold; margin-bottom: 12px; }
                            h2 { font-size: 20px; font-weight: bold; margin-top: 16px; margin-bottom: 8px; }
                            h3 { font-size: 16px; font-weight: bold; margin-top: 12px; margin-bottom: 6px; }
                            p { font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
                            ul, ol { margin-left: 20px; margin-bottom: 8px; list-style-type: disc; }
                            code { background-color: #f1f5f9; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
                            pre { background-color: #f1f5f9; padding: 12px; border-radius: 6px; overflow-x: auto; font-family: monospace; }
                            blockquote { border-left: 4px solid #10b981; padding-left: 12px; font-style: italic; color: #475569; }
                        </style>
                        ${htmlContent}
                    `;
                    document.body.appendChild(container);

                    if (window.html2pdf) {
                        const opt = {
                            margin: 10,
                            filename: 'converted.pdf',
                            image: { type: 'jpeg', quality: 0.98 },
                            html2canvas: { scale: 2, useCORS: true },
                            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                        };
                        const pdfBlob = await window.html2pdf().from(container).set(opt).output('blob');
                        state.outputUrl = URL.createObjectURL(pdfBlob);
                    } else {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        const lines = doc.splitTextToSize(state.inputText, 180);
                        doc.text(lines, 10, 10);
                        state.outputUrl = URL.createObjectURL(doc.output('blob'));
                    }
                    document.body.removeChild(container);
                } else if (state.mode === 'md-to-html') {
                    if (!state.inputText.trim()) throw new Error("Please enter some Markdown text.");
                    state.outputHtml = marked.parse(state.inputText);
                } else if (state.mode === 'html-to-md') {
                    if (!state.inputText.trim()) throw new Error("Please enter some HTML text.");
                    const turndownService = new TurndownService();
                    state.inputText = turndownService.turndown(state.inputText);
                    state.outputHtml = 'Converted HTML to MD! See input text above.';
                } else if (state.mode === 'pdf-to-md') {
                    if (!state.pdfFile) throw new Error("Please select a PDF file");
                    const arrayBuffer = await state.pdfFile.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument(arrayBuffer).promise;
                    let text = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        const strings = content.items.map(item => item.str);
                        text += strings.join(' ') + '\n\n';
                    }
                    state.inputText = text;
                    state.outputHtml = 'Extracted text from PDF! See input text above.';
                }
            } catch (err) {
                alert('Error processing: ' + err.message);
                console.error(err);
            }

            state.isProcessing = false;
            render();
        }

        function handleShare() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied to clipboard!');
        }

        function handleBookmark() {
            navigator.clipboard.writeText(window.location.href);
            alert('URL copied to clipboard! Press Ctrl+D (Cmd+D on Mac) to bookmark this page.');
        }

        // Render
        function render() {
            const { Button, Card, TextArea } = window.zm.ui;

            const isPdfInput = state.mode === 'pdf-to-md';

            let interfaceContent = `
                <div class="space-y-5">
                    <div class="mb-4">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Conversion Direction</label>
                        <div class="relative">
                            <select 
                                class="w-full rounded-xl border border-slate-300 dark:border-slate-700 shadow-2xs focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500 text-sm font-semibold bg-slate-50/90 dark:bg-slate-950/70 text-slate-900 dark:text-white p-3 pr-10 appearance-none transition-colors"
                                onchange="state.mode = this.value; state.inputText = ''; state.pdfFile = null; render();"
                            >
                                ${modes.map(m => `<option value="${m.id}" ${state.mode === m.id ? 'selected' : ''}>${m.label}</option>`).join('')}
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-500 dark:text-slate-400">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>
                    </div>
            `;

            if (isPdfInput) {
                interfaceContent += `
                    <div class="border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-emerald-500 dark:hover:border-emerald-400 rounded-2xl p-8 sm:p-10 text-center transition-all duration-200 cursor-pointer bg-slate-50/80 dark:bg-slate-950/60 hover:bg-emerald-50/30 dark:hover:bg-emerald-950/20 group">
                        <input type="file" id="file-input" accept="application/pdf" class="hidden" onchange="window.handleFileSelect(event)">
                        <label for="file-input" class="cursor-pointer block">
                            <div class="p-3.5 w-14 h-14 mx-auto bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xs mb-3 group-hover:scale-105 group-hover:border-emerald-500/50 group-hover:text-emerald-500 transition-all text-slate-500 dark:text-slate-400 flex items-center justify-center">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            </div>
                            <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">
                                <span class="font-bold text-emerald-600 dark:text-emerald-400 group-hover:underline">Click to select PDF</span> or drag and drop
                            </p>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">${state.pdfFile ? `Selected: <span class="text-emerald-600 dark:text-emerald-400 font-bold">${state.pdfFile.name}</span>` : 'PDF files up to 50MB'}</p>
                        </label>
                    </div>
                `;
            } else {
                interfaceContent += TextArea({
                    id: 'main-input',
                    label: state.mode.startsWith('md') ? 'Markdown Input' : 'HTML Input',
                    placeholder: state.mode.startsWith('md') ? '# Document Title\n\nWrite formatted **markdown** here to convert...' : '<h1>Document Title</h1>\n<p>Write HTML here...</p>',
                    value: state.inputText || '',
                    onInput: 'window.handleInputChange(event)',
                    rows: 9
                });
            }

            interfaceContent += `
                <div class="flex justify-end mt-4">
                    ${Button({
                        text: state.isProcessing ? 'Converting...' : 'Convert Document',
                        onClick: 'window.handleAction()',
                        variant: 'primary',
                        className: 'w-full sm:w-auto px-8 py-3 text-base',
                        disabled: state.isProcessing || (isPdfInput && !state.pdfFile) || (!isPdfInput && !state.inputText)
                    })}
                </div>
            `;

            if (state.outputUrl) {
                interfaceContent += `
                    <div class="mt-6 p-6 bg-emerald-50/90 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xs">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 rounded-xl bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-emerald-950 dark:text-emerald-100">Conversion Complete</h4>
                                <p class="text-xs text-emerald-700 dark:text-emerald-300">Your PDF was rendered client-side with zero uploads.</p>
                            </div>
                        </div>
                        <a href="${state.outputUrl}" download="converted.pdf" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-xs transition-colors">
                            Download PDF →
                        </a>
                    </div>
                `;
            } else if (state.outputHtml) {
                interfaceContent += `
                    <div class="mt-6 p-5 border border-slate-300 dark:border-slate-700 rounded-2xl bg-slate-50/80 dark:bg-slate-950/80 max-h-80 overflow-y-auto">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-3 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>Rendered Output Preview:</h4>
                        <div class="prose dark:prose-invert max-w-none text-sm text-slate-800 dark:text-slate-200">${state.outputHtml}</div>
                    </div>
                `;
            }

            interfaceContent += `</div>`;

            app.innerHTML = interfaceContent;
        }

        // Global handlers
        window.handleInputChange = (e) => { state.inputText = e.target.value; render(); };
        window.handleFileSelect = (e) => { 
            if (e.target.files && e.target.files[0]) {
                state.pdfFile = e.target.files[0];
                render();
            }
        };
        window.handleAction = handleAction;
        window.handleShare = handleShare;
        window.handleBookmark = handleBookmark;

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', savedTheme === 'dark');
        document.documentElement.dataset.theme = savedTheme;

        // Initial render
        render();
    </script>
</body>
</html>
