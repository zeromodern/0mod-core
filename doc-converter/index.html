<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Converter - 0mod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            black: '#0f172a',
                            gray: '#f8fafc',
                            accent: '#10b981',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../shared/base.css">
    <meta name="description" content="Free offline tool to convert between Markdown, PDF, and HTML securely in your browser.">
    <!-- Scripts for conversion -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        // PDF.js worker
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>
</head>
<body class="bg-brand-gray dark:bg-slate-950 min-h-screen font-sans text-slate-800 dark:text-slate-100 antialiased transition-colors duration-200">
    <div id="app" class="max-w-5xl mx-auto px-4 py-12"></div>

    <script src="../shared/ui-kit.js"></script>
    <script src="../shared/icons.js"></script>
    <script>
        const app = document.getElementById('app');

        // State
        let state = {
            isProcessing: false,
            mode: 'md-to-pdf',
            inputText: '',
            outputHtml: '',
            outputUrl: null,
            pdfFile: null
        };

        const modes = [
            { id: 'md-to-pdf', label: 'Markdown to PDF' },
            { id: 'md-to-html', label: 'Markdown to HTML' },
            { id: 'html-to-md', label: 'HTML to Markdown' },
            { id: 'pdf-to-md', label: 'PDF to Markdown' }
        ];

        // Logic
        async function handleAction() {
            state.isProcessing = true;
            state.outputUrl = null;
            state.outputHtml = '';
            render();

            try {
                if (state.mode === 'md-to-pdf') {
                    if (!state.inputText.trim()) throw new Error("Please enter some Markdown text.");
                    const htmlContent = marked.parse(state.inputText);
                    
                    const container = document.createElement('div');
                    container.className = 'pdf-render-container p-8 bg-white text-slate-900 font-sans space-y-4';
                    container.style.position = 'absolute';
                    container.style.left = '-9999px';
                    container.style.width = '750px';
                    container.innerHTML = `
                        <style>
                            h1 { font-size: 24px; font-weight: bold; margin-bottom: 12px; }
                            h2 { font-size: 20px; font-weight: bold; margin-top: 16px; margin-bottom: 8px; }
                            h3 { font-size: 16px; font-weight: bold; margin-top: 12px; margin-bottom: 6px; }
                            p { font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
                            ul, ol { margin-left: 20px; margin-bottom: 8px; list-style-type: disc; }
                            code { background-color: #f1f5f9; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
                            pre { background-color: #f1f5f9; padding: 12px; border-radius: 6px; overflow-x: auto; font-family: monospace; }
                            blockquote { border-left: 4px solid #10b981; padding-left: 12px; font-style: italic; color: #475569; }
                        </style>
                        ${htmlContent}
                    `;
                    document.body.appendChild(container);

                    if (window.html2pdf) {
                        const opt = {
                            margin: 10,
                            filename: 'converted.pdf',
                            image: { type: 'jpeg', quality: 0.98 },
                            html2canvas: { scale: 2, useCORS: true },
                            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                        };
                        const pdfBlob = await window.html2pdf().from(container).set(opt).output('blob');
                        state.outputUrl = URL.createObjectURL(pdfBlob);
                    } else {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        const lines = doc.splitTextToSize(state.inputText, 180);
                        doc.text(lines, 10, 10);
                        state.outputUrl = URL.createObjectURL(doc.output('blob'));
                    }
                    document.body.removeChild(container);
                } else if (state.mode === 'md-to-html') {
                    if (!state.inputText.trim()) throw new Error("Please enter some Markdown text.");
                    state.outputHtml = marked.parse(state.inputText);
                } else if (state.mode === 'html-to-md') {
                    if (!state.inputText.trim()) throw new Error("Please enter some HTML text.");
                    const turndownService = new TurndownService();
                    state.inputText = turndownService.turndown(state.inputText);
                    state.outputHtml = 'Converted HTML to MD! See input text above.';
                } else if (state.mode === 'pdf-to-md') {
                    if (!state.pdfFile) throw new Error("Please select a PDF file");
                    const arrayBuffer = await state.pdfFile.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument(arrayBuffer).promise;
                    let text = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        const strings = content.items.map(item => item.str);
                        text += strings.join(' ') + '\n\n';
                    }
                    state.inputText = text;
                    state.outputHtml = 'Extracted text from PDF! See input text above.';
                }
            } catch (err) {
                alert('Error processing: ' + err.message);
                console.error(err);
            }

            state.isProcessing = false;
            render();
        }

        function handleShare() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied to clipboard!');
        }

        function handleBookmark() {
            navigator.clipboard.writeText(window.location.href);
            alert('URL copied to clipboard! Press Ctrl+D (Cmd+D on Mac) to bookmark this page.');
        }

        // Render
        function render() {
            const { Button, Card, Input, TextArea } = window.zm.ui;

            const isPdfInput = state.mode === 'pdf-to-md';

            let interfaceContent = `
                <div class="space-y-4">
                    <div class="flex gap-4 mb-4">
                        <select 
                            class="flex-1 rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm dark:bg-slate-900 dark:border-slate-700 dark:text-white p-2 border"
                            onchange="state.mode = this.value; state.inputText = ''; state.pdfFile = null; render();"
                        >
                            ${modes.map(m => `<option value="${m.id}" ${state.mode === m.id ? 'selected' : ''}>${m.label}</option>`).join('')}
                        </select>
                    </div>
            `;

            if (isPdfInput) {
                interfaceContent += `
                    <div class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-lg p-8 text-center hover:border-emerald-500 transition-colors">
                        <input type="file" id="file-input" accept="application/pdf" class="hidden" onchange="window.handleFileSelect(event)">
                        <label for="file-input" class="cursor-pointer block">
                            <div class="text-4xl mb-4">📄</div>
                            <p class="text-slate-600 dark:text-slate-400">Click to select PDF or drag and drop</p>
                            <p class="text-sm text-slate-500 mt-2">${state.pdfFile ? state.pdfFile.name : 'No file selected'}</p>
                        </label>
                    </div>
                `;
            } else {
                interfaceContent += TextArea({
                    id: 'main-input',
                    label: 'Input Content',
                    placeholder: '# Markdown Title\n\nWrite formatted **markdown** here to convert...',
                    value: state.inputText || '',
                    onInput: 'window.handleInputChange(event)',
                    rows: 8
                });
            }

            interfaceContent += `
                <div class="flex justify-end mt-4">
                    ${Button({
                        text: state.isProcessing ? 'Processing...' : 'Run Action',
                        onClick: 'window.handleAction()',
                        variant: 'primary',
                        disabled: state.isProcessing || (isPdfInput && !state.pdfFile) || (!isPdfInput && !state.inputText)
                    })}
                </div>
            `;

            if (state.outputUrl) {
                interfaceContent += `
                    <div class="mt-4 p-4 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-800 dark:text-emerald-200 rounded-md flex items-center justify-between">
                        <span>Ready! Download your rendered PDF:</span>
                        <a href="${state.outputUrl}" download="converted.pdf" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition-colors">Download PDF</a>
                    </div>
                `;
            } else if (state.outputHtml) {
                interfaceContent += `
                    <div class="mt-4 p-4 border rounded-md bg-white dark:bg-slate-900 dark:border-slate-700 max-h-64 overflow-y-auto">
                        <h3 class="font-bold mb-2">Output:</h3>
                        <div class="prose dark:prose-invert max-w-none">${state.outputHtml}</div>
                    </div>
                `;
            }

            interfaceContent += `</div>`;

            app.innerHTML = `
                <!-- TOOL UI START -->
                <div class="space-y-8">
                    <header class="text-center">
                        <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Document Converter</h1>
                        <p class="text-slate-600 dark:text-slate-400">Free offline tool to convert between Markdown, PDF, and HTML.</p>
                    </header>

                    ${Card({
                        title: 'Converter Interface',
                        content: interfaceContent
                    })}

                    <div class="text-center text-sm text-slate-500 dark:text-slate-400">
                        <p>100% Client-side processing. Your data never leaves your browser.</p>
                    </div>

                    <footer class="mt-12 pt-8 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <span class="text-xs font-medium text-slate-400">v1.1.0</span>
                            <button onclick="window.handleShare()" class="text-xs font-medium text-emerald-600 hover:text-emerald-700 dark:text-emerald-400 dark:hover:text-emerald-300 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                                Share Tool
                            </button>
                            <button onclick="window.handleBookmark()" class="text-xs font-medium text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                                Bookmark Tool
                            </button>
                        </div>
                        <div class="flex items-center gap-2 text-[10px] text-slate-400 uppercase tracking-widest font-bold">
                            🛡️ Zero Uploads • 100% Private
                        </div>
                    </footer>
                </div>
                <!-- TOOL UI END -->
            `;
        }

        // Global handlers
        window.handleInputChange = (e) => { state.inputText = e.target.value; render(); };
        window.handleFileSelect = (e) => { 
            if (e.target.files && e.target.files[0]) {
                state.pdfFile = e.target.files[0];
                render();
            }
        };
        window.handleAction = handleAction;
        window.handleShare = handleShare;
        window.handleBookmark = handleBookmark;

        // Initialize theme
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', savedTheme === 'dark');
        document.documentElement.dataset.theme = savedTheme;

        // Initial render
        render();
    </script>
</body>
</html>
